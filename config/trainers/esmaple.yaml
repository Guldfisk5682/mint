DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TRAIN_U:
    SAME_AS_X: True
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.0035
  MAX_EPOCH: 5
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20
  COUNT_ITER: "smaller_one"
  SOURCE_ONLY: true

TEST:
  EVAL_EVERY_EPOCH: false
  FINAL_MODEL: "last_step"

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  NAME: "ContinuousSharedProjMaPLeMTDA"
  MAPLE_MTDA:
    N_CTX: 2
    CTX_INIT: "a photo of a"
    PREC: "fp16"
    PROMPT_DEPTH: 9
    USE_MAPLE_CLIP_BUILD: true
    LAMBDA_PL: 0.0
    LAMBDA_PL_FINAL: 0.0
    PL_SCHEDULE: "constant"
    PL_THRESHOLD: 0.7
    PL_STUDENT_THRESHOLD: 0.7
    PL_USE_STUDENT_LOW_CONF_MASK: true
    ZS_PROMPT_TEMPLATE: "a photo of a {}."
    WEAK_PL:
      ENABLED: false
      LAMBDA: 0.0
      TEACHER_THRESHOLD: 0.6
      TEACHER_THRESHOLD_HIGH: 0.7
      STUDENT_THRESHOLD: 0.7
      USE_STUDENT_LOW_CONF_MASK: true
      FRACTION: 0.2
      MOMENTUM: 0.9
      EPS: 1e-6
    SELF_DISTILL:
      ENABLED: false
      LAMBDA: 0.0
      MODE: "confidence_band"
      TEMPERATURE: 2.0
      OLD_CONF_LOW: 0.45
      OLD_CONF_HIGH: 0.8
      CLIP_CONF_HIGH: 0.7
      EPS: 1e-6
    POST_INIT:
      ENABLED: false
      MODEL_DIR: ""
      LOAD_EPOCH: -1
    DEBUG:
      PRINT_ONCE: false
