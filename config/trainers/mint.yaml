DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TRAIN_U:
    SAME_AS_X: True
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.0035
  MAX_EPOCH: 5
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20
  COUNT_ITER: "smaller_one"
  SOURCE_ONLY: false

TEST:
  EVAL_EVERY_EPOCH: false
  FINAL_MODEL: "last_step"

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  NAME: "CurriculumContinuousSharedProjMaPLeMTDA"
  MAPLE_MTDA:
    N_CTX: 2
    CTX_INIT: "a photo of a"
    PREC: "fp16"
    PROMPT_DEPTH: 9
    USE_MAPLE_CLIP_BUILD: true
    LAMBDA_PL: 0.3
    LAMBDA_PL_FINAL: 0.3
    PL_SCHEDULE: "constant"
    PL_THRESHOLD: 0.7
    PL_STUDENT_THRESHOLD: 0.7
    PL_USE_STUDENT_LOW_CONF_MASK: true
    PL_VARIANT: "agreement_hard_student_soft"
    PL_DUAL_CONF_THRESHOLD: 0.7
    PL_SOFT_BETA: 1.0
    PL_STUDENT_SOFT_LAMBDA: 0.5
    PL_STRONG_AUGMENT: "randaugment_fixmatch"
    PL_DIAGNOSTIC_WINDOW: 50
    PL_GRAD_AUDIT_INTERVAL: 50
    ZS_PROMPT_TEMPLATE: "a photo of a {}."
    CURRICULUM:
      DOMAIN_ORDER: []
      STAGE_STEP_WEIGHTS: []
      MICROBATCHES_PER_STEP: 3
      RESET_OPTIM_PER_STAGE: false
      STAGE_VIRTUAL_EPOCHS: 5
      REPLAY:
        ENABLED: true
        TOPK_PER_CLASS: 8
        STUDENT_THRESHOLD: 0.7
        CLIP_THRESHOLD: 0.7
        LAMBDA: 0.75
        SELECTION_MODE: "online"
        LABEL_SOURCE: "pseudo"
        MANIFEST_PATH: ""
        TRAVERSAL: "cycle"
        NORMALIZATION: "none"
      DIAGNOSTICS:
        ENABLED: false
        AUDIT_ALL_DOMAINS: true
